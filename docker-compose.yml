services:
  prometheus:
    image: prom/prometheus:latest
    container_name: kubimetrics-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: kubimetrics-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
